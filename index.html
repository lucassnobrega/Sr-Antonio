<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LN CONSULTORIA — Dashboard do Cliente</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#080c14; --panel:#0f1420; --panel2:#141925;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#edf2f7; --muted:#8896a8; --muted2:#6b7a8d;
  --gold:#c5a572; --gold2:#e8c98a; --gold-bg:rgba(197,165,114,.12);
  --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --blue:#6366f1; --purple:#a855f7;
  --brand:#3b52c4; --radius:16px; --shadow:0 20px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#93b4ff;text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 22px;background:rgba(8,12,20,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;font-weight:800}.brand-badge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111;box-shadow:0 0 16px rgba(197,165,114,.24);overflow:hidden;flex-shrink:0}.brand-badge img{width:100%;height:100%;object-fit:cover}
.client-chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);padding:8px 12px;border-radius:999px;color:var(--muted);font-size:.82rem}
.client-chip img{width:22px;height:22px;object-fit:cover;border-radius:999px}
.nav{display:flex;gap:6px;flex-wrap:wrap}.nav button{border:none;background:transparent;color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer;transition:.2s}.nav button:hover{background:rgba(255,255,255,.05);color:var(--text)}.nav button.active{background:var(--gold-bg);color:var(--gold)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}.icon-btn,.primary-btn,.ghost-btn,.danger-btn,.small-btn{border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 11px;border-radius:8px;cursor:pointer;transition:.2s}.icon-btn:hover,.ghost-btn:hover,.small-btn:hover{background:rgba(255,255,255,.04);border-color:var(--line2);color:var(--text)}.primary-btn{background:#2563eb;border-color:#2563eb;color:#fff}.primary-btn:hover{background:#1d4ed8;border-color:#1d4ed8}.danger-btn{background:rgba(239,68,68,.1);color:#fca5a5;border-color:rgba(239,68,68,.22)}.small-btn{padding:4px 8px;font-size:.76rem}
.wrap{max-width:1460px;margin:0 auto;padding:26px 22px 60px}
.page{display:none;animation:fade .2s ease}.page.active{display:block}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:22px 0 8px}.hero-logo{width:70px;height:70px;border-radius:20px;display:grid;place-items:center;margin:0 auto 14px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111;overflow:hidden;box-shadow:0 0 20px rgba(197,165,114,.18)}.hero-logo img{width:100%;height:100%;object-fit:cover}.hero h1{font-size:2.8rem;font-weight:900;letter-spacing:-.04em;margin-bottom:6px;background:linear-gradient(135deg,var(--gold),var(--gold2),#fff8e8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.hero p{color:var(--muted)}
.hero-meta{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:.76rem;color:var(--muted2)}.pulse{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);display:inline-block;margin-right:5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px;margin:22px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center}.stat .num{font-size:1.95rem;font-weight:900;letter-spacing:-.03em}.stat .lbl{margin-top:6px;color:var(--muted);font-size:.78rem}.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.section-title{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:30px 0 13px;display:flex;align-items:center;gap:12px}.section-title:after{content:'';flex:1;height:1px;background:var(--line)}
.progress-box,.panel,.chart-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.progress-row{display:flex;gap:12px;align-items:center;margin:9px 0}.progress-label{width:210px;flex-shrink:0;font-size:.86rem}.progress-bar{flex:1;height:7px;background:rgba(255,255,255,.06);border-radius:999px}.progress-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--brand),#7f93ff)}.progress-pct{width:40px;text-align:right;color:var(--muted);font-size:.77rem}
.overview-charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}@media(max-width:860px){.overview-charts{grid-template-columns:1fr}}.chart-card h4{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:14px}.donut-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.donut-wrap{position:relative;width:105px;height:105px;flex-shrink:0}.donut-wrap canvas{position:absolute;inset:0}.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.donut-center .dc-n{font-size:1.25rem;font-weight:800}.donut-center .dc-l{font-size:.63rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}.donut-legend{display:flex;flex-direction:column;gap:7px;flex:1}.legend-item{display:flex;align-items:center;gap:7px;font-size:.81rem}.legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.brand-card{background:linear-gradient(140deg,#0c1030,#1b2460,#1e2e8c);border:1px solid var(--line);border-radius:20px;padding:22px;cursor:pointer;transition:.2s}.brand-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.brand-stat-row{display:flex;gap:14px;margin-top:14px}.brand-stat{flex:1;text-align:center}.brand-stat .n{font-size:1.35rem;font-weight:800}.brand-stat .l{font-size:.7rem;color:rgba(255,255,255,.58)}
.page-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start;margin-bottom:18px}.page-head h2{font-size:1.9rem;font-weight:900;letter-spacing:-.03em}.page-head p{margin-top:4px;color:var(--muted)}
.page-brand{display:flex;align-items:center;gap:12px}.page-brand .brand-badge{width:44px;height:44px}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filter input,.filter select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 11px;outline:none}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 16px}.subnav button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer}.subnav button.active{background:var(--brand);border-color:transparent;color:#fff}
.kanban-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:1100px){.kanban-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.kanban-grid{grid-template-columns:1fr}}
.kan-col{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}.kan-head{padding:11px 15px;font-weight:800;font-size:.86rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.kan-body{padding:9px;display:flex;flex-direction:column;gap:8px;min-height:200px}.done-h{background:rgba(34,197,94,.08);color:#6ee7a0}.focus-h{background:rgba(168,85,247,.1);color:#d8b4fe}.doing-h{background:rgba(245,158,11,.09);color:#fbbf24}.pending-h{background:rgba(239,68,68,.09);color:#fca5a5}
.item-card{background:rgba(255,255,255,.033);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:.2s}.item-card:hover{transform:translateY(-2px);border-color:var(--line2);background:rgba(255,255,255,.05)}.item-top{display:flex;justify-content:space-between;gap:8px}.item-title{font-size:.89rem;font-weight:800;line-height:1.35;margin-top:7px}.item-meta{margin-top:6px;color:var(--muted);font-size:.77rem;line-height:1.4}.item-docs{margin-top:6px;font-size:.75rem}.item-actions{display:flex;gap:5px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.71rem;font-weight:700;border-radius:999px;padding:4px 8px}.done{background:rgba(34,197,94,.12);color:#6ee7a0}.focus{background:rgba(168,85,247,.15);color:#d8b4fe}.doing{background:rgba(245,158,11,.13);color:#fbbf24}.pending{background:rgba(239,68,68,.12);color:#fca5a5}.cat-tag{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
.exec-summary{background:linear-gradient(160deg,rgba(197,165,114,.08),rgba(197,165,114,.025));border:1px solid rgba(197,165,114,.18);border-radius:18px;padding:18px;margin:16px 0 22px}.exec-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:12px}@media(max-width:1100px){.exec-grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.exec-grid{grid-template-columns:1fr}}.exec-card{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:13px;padding:14px}.exec-card h3{margin:0 0 9px;font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.exec-list{margin:0;padding-left:16px;color:var(--text)}.exec-list li{margin:5px 0;font-size:.85rem}.mini-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:13px}@media(max-width:860px){.mini-kpis{grid-template-columns:repeat(3,1fr)}}.mini-kpi{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:11px;padding:11px;text-align:center}.mini-kpi .n{font-size:1.2rem;font-weight:800}.mini-kpi .l{font-size:.7rem;color:var(--muted);margin-top:3px}
.timeline-list{display:flex;flex-direction:column;gap:11px}.timeline-item{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:13px;padding:14px 14px 14px 18px;position:relative}.timeline-item:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:13px 0 0 13px;background:var(--gold)}.timeline-date{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--gold);font-weight:700}.timeline-title{font-weight:800;font-size:.93rem;margin:.22rem 0}.timeline-sub{color:var(--muted);font-size:.82rem}.timeline-actions{margin-top:9px;display:flex;gap:7px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,4,12,.74);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}.modal-backdrop.show{display:flex}.modal{width:min(980px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#0f1624,#090d18);border:1px solid rgba(255,255,255,.09);border-radius:22px;box-shadow:var(--shadow)}.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.modal-body{padding:22px}.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.modal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}@media(max-width:860px){.modal-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.modal-grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}.field input,.field textarea,.field select{width:100%;background:rgba(255,255,255,.04);color:var(--text);border:1px solid rgba(255,255,255,.09);border-radius:11px;padding:10px 13px;outline:none}.field textarea{min-height:96px;resize:vertical}.doc-row{display:grid;grid-template-columns:1fr 1.5fr auto;gap:9px;margin-bottom:9px}@media(max-width:660px){.doc-row{grid-template-columns:1fr}}
.file-hint{font-size:.72rem;color:var(--muted2)}
.meta-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.meta-tag{display:inline-flex;align-items:center;gap:5px;font-size:.71rem;font-weight:700;border-radius:999px;padding:4px 8px;background:rgba(255,255,255,.06);border:1px solid var(--line)}.box{margin-top:11px;padding:13px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.025)}.box strong{display:block;margin-bottom:5px;font-size:.78rem;text-transform:uppercase;color:var(--muted)}
.toast-container{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:9px;z-index:200}.toast{background:#161e2e;border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:11px 15px;font-size:.83rem;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.empty-state{padding:28px 16px;text-align:center;color:var(--muted2);border:1px dashed rgba(255,255,255,.08);border-radius:12px}
@media print{.topbar,.top-actions,.filter,.subnav,.item-actions,.timeline-actions,.toast-container{display:none!important}.page{display:block!important}.wrap{padding:0}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div id="topBadge" class="brand-badge">🏢</div>
    <div id="topBrandName">LN CONSULTORIA</div>
  </div>
  <div class="nav">
    <button class="nav-btn active" data-page="overview">Visão Geral</button>
    <button class="nav-btn" data-page="activities">Atividades</button>
    <button class="nav-btn" data-page="operation">Operação</button>
    <button class="nav-btn" data-page="timeline">Linha do Tempo</button>
  </div>
  <div class="top-actions">
    <div id="clientChip" class="client-chip"></div>
    <button class="icon-btn" onclick="openSettingsModal()" title="Configurações">⚙️</button>
    <button class="icon-btn" onclick="exportJSON()" title="Baixar data.json">⬇️</button>
    <button class="icon-btn" onclick="document.getElementById('importInput').click()" title="Importar data.json">⬆️</button>
    <button class="icon-btn" onclick="loadPublishedVersion(true)" title="Recarregar versão publicada">☁️</button>
  </div>
</div>
<div class="wrap">
  <section id="page-overview" class="page active"></section>
  <section id="page-activities" class="page"></section>
  <section id="page-operation" class="page"></section>
  <section id="page-timeline" class="page"></section>
</div>
<div id="detailModal" class="modal-backdrop"><div class="modal" id="detailContent"></div></div>
<div id="itemModal" class="modal-backdrop"><div class="modal" id="itemContent"></div></div>
<div id="settingsModal" class="modal-backdrop"><div class="modal" id="settingsContent"></div></div>
<div id="timelineModal" class="modal-backdrop"><div class="modal" id="timelineContent"></div></div>
<div id="toastContainer" class="toast-container"></div>
<input id="importInput" class="hidden" type="file" accept="application/json" />
<script>
const STORAGE_KEY='dashboard_generico_v2_local';
const TS_KEY='dashboard_generico_v2_ts';
const DATA_FILE='data.json';
const ALL_STATUSES=['Concluído','Em foco','Em andamento','Pendente'];
const PILLARS=['marketing','pessoas','financeiro','processos','expansao'];
const DEFAULT_DATA={
  config:{
    consultancyName:'LN CONSULTORIA',
    consultancyLogo:'',
    clientName:'Cliente Exemplo',
    clientLogo:'',
    heroSubtitle:'Painel Estratégico da Consultoria',
    operationName:'Operação Principal',
    operationIcon:'🏢'
  },
  items:[
    {id:'i1',title:'Diagnóstico inicial da operação',pillar:'processos',category:'Processos',status:'Concluído',priority:'Alta',owner:'Lucas',summary:'Levantamento dos principais gargalos da operação e definição das prioridades de ataque.',problem:'Falta de clareza sobre os principais problemas e prioridades do projeto.',businessImpact:'Dá direção para a consultoria e organiza o plano de ação.',nextStep:'Avançar para a implantação dos ajustes prioritários.',docs:[]},
    {id:'i2',title:'Plano de ação comercial',pillar:'marketing',category:'Marketing',status:'Em foco',priority:'Alta',owner:'Lucas',summary:'Estruturação das ações comerciais prioritárias para crescimento.',problem:'A operação não possui uma rotina comercial consistente.',businessImpact:'Melhora geração de demanda e previsibilidade de vendas.',nextStep:'Validar calendário e responsáveis.',docs:[]},
    {id:'i3',title:'Organização financeira básica',pillar:'financeiro',category:'Finanças',status:'Em andamento',priority:'Média',owner:'Lucas',summary:'Construção de visão financeira gerencial com foco em decisão.',problem:'Os números não estão organizados de forma útil para tomada de decisão.',businessImpact:'Ajuda o cliente a entender margem, despesas e prioridades.',nextStep:'Consolidar indicadores e rotina de acompanhamento.',docs:[]},
    {id:'i4',title:'Rotina de acompanhamento semanal',pillar:'pessoas',category:'Pessoas',status:'Pendente',priority:'Média',owner:'Lucas',summary:'Definir formato da reunião e indicadores de acompanhamento.',problem:'As ações não têm cadência de acompanhamento formal.',businessImpact:'Aumenta execução e controle do plano de ação.',nextStep:'Implementar primeira reunião semanal.',docs:[]}
  ],
  timeline:[
    {id:'t1',date:'2026-04',title:'Início da consultoria',subtitle:'Assinatura e kickoff do projeto',phase:'Diagnóstico'},
    {id:'t2',date:'2026-05',title:'Diagnóstico concluído',subtitle:'Definição das principais frentes prioritárias',phase:'Estruturação'},
    {id:'t3',date:'2026-06',title:'Implantação em andamento',subtitle:'Execução das ações definidas',phase:'Execução'}
  ]
};
let publishedData=clone(DEFAULT_DATA);
let state=clone(DEFAULT_DATA);
let currentPillar='marketing';
let activityFilter='';
let activityStatus='';
let activityPillar='';
const charts={};
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(p='id'){return p+'_'+Math.random().toString(36).slice(2,9)}
function pillarLabel(p){return{marketing:'Marketing',pessoas:'Gestão de Pessoas',financeiro:'Financeiro & CMV',processos:'Processos & Operação',expansao:'Expansão'}[p]||p}
function pillarIcon(p){return{marketing:'📣',pessoas:'👥',financeiro:'💰',processos:'⚙️',expansao:'🚀'}[p]||'📌'}
function statusClass(s){return s==='Concluído'?'done':s==='Em foco'?'focus':s==='Em andamento'?'doing':'pending'}
function progressFor(list){if(!list.length) return 0; const pts=list.reduce((a,i)=>a+(i.status==='Concluído'?1:(i.status==='Em foco'||i.status==='Em andamento'?0.5:0)),0); return Math.round((pts/list.length)*100)}
function countByStatus(list,s){return list.filter(i=>i.status===s).length}
function sortItems(arr){const pr={Alta:0,Média:1,Baixa:2}; const st={'Concluído':0,'Em foco':1,'Em andamento':2,'Pendente':3}; return [...arr].sort((a,b)=>(st[a.status]-st[b.status])||(pr[a.priority]-pr[b.priority])||a.title.localeCompare(b.title,'pt-BR'))}
function enrich(data){
  data.config=data.config||clone(DEFAULT_DATA.config);
  data.items=(data.items||[]).map(i=>({
    category:i.category||pillarLabel(i.pillar||'processos'),
    problem:i.problem||'Gargalo ou risco identificado na operação e/ou gestão que justificou a frente de trabalho.',
    businessImpact:i.businessImpact||'Fortalece controle, clareza de execução e base para crescimento com mais previsibilidade.',
    nextStep:i.nextStep||'Consolidar implantação prática, acompanhar aderência e validar resultado na rotina.',
    docs:i.docs||[],
    ...i
  }));
  data.timeline=data.timeline||[];
  return data;
}
async function loadPublishedData(){
  try{const res=await fetch(DATA_FILE+'?v='+Date.now(),{cache:'no-store'}); if(!res.ok) throw new Error('Falha ao carregar data.json'); const data=await res.json(); publishedData=enrich(data); return clone(publishedData);}catch(e){console.warn(e); return clone(DEFAULT_DATA)}
}
function loadLocalState(){try{const raw=localStorage.getItem(STORAGE_KEY); if(raw) return enrich(JSON.parse(raw));}catch(e){} return clone(publishedData)}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); localStorage.setItem(TS_KEY,Date.now())}
function getLastUpdated(){const ts=localStorage.getItem(TS_KEY); return ts?new Date(+ts):null}
function toast(msg){const c=document.getElementById('toastContainer'); const el=document.createElement('div'); el.className='toast'; el.textContent=msg; c.appendChild(el); setTimeout(()=>el.remove(),2800)}
function switchPage(page){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active')); document.getElementById('page-'+page).classList.add('active'); document.querySelector(`.nav-btn[data-page="${page}"]`).classList.add('active')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function setLogoSlot(el,src,fallbackText){if(!el) return; el.innerHTML=src?`<img src="${esc(src)}" alt="logo" />`:esc(fallbackText)}
function renderClientChip(){const chip=document.getElementById('clientChip'); if(!chip) return; chip.innerHTML=state.config.clientLogo?`<img src="${esc(state.config.clientLogo)}" alt="cliente" /><span>${esc(state.config.clientName)}</span>`:`<span>${esc(state.config.clientName)}</span>`}
function applyBranding(){
  document.title=`${state.config.clientName} — Dashboard`;
  document.getElementById('topBrandName').textContent=state.config.consultancyName;
  setLogoSlot(document.getElementById('topBadge'),state.config.consultancyLogo,state.config.operationIcon||'🏢');
  renderClientChip();
}

function fileToDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader(); reader.onload=()=>resolve(reader.result); reader.onerror=reject; reader.readAsDataURL(file);})}
function openSettingsModal(){const c=state.config; document.getElementById('settingsContent').innerHTML=`<div class="modal-head"><div><div style="font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em">Configurações</div><h3 style="margin-top:8px;font-size:1.55rem">Identidade do cliente</h3></div><button class="icon-btn" onclick="closeModal('settingsModal')">✕</button></div><div class="modal-body"><div class="modal-grid"><div class="field" style="grid-column:span 2"><label>Nome da consultoria</label><input id="c_consultancyName" value="${esc(c.consultancyName)}" /></div><div class="field" style="grid-column:span 2"><label>Nome do cliente</label><input id="c_clientName" value="${esc(c.clientName)}" /></div><div class="field" style="grid-column:span 2"><label>Subtítulo</label><input id="c_heroSubtitle" value="${esc(c.heroSubtitle)}" /></div><div class="field"><label>Nome da operação</label><input id="c_operationName" value="${esc(c.operationName)}" /></div><div class="field"><label>Ícone</label><input id="c_operationIcon" value="${esc(c.operationIcon)}" /></div><div class="field" style="grid-column:span 2"><label>Logo da consultoria (URL)</label><input id="c_consultancyLogo" value="${esc(c.consultancyLogo||'')}" placeholder="https://..." /></div><div class="field" style="grid-column:span 2"><label>Logo do cliente (URL)</label><input id="c_clientLogo" value="${esc(c.clientLogo||'')}" placeholder="https://..." /></div><div class="field" style="grid-column:span 2"><label>Upload logo da consultoria</label><input id="c_consultancyLogoFile" type="file" accept="image/*" /><div class="file-hint">Se escolher uma imagem aqui, ela substitui a URL.</div></div><div class="field" style="grid-column:span 2"><label>Upload logo do cliente</label><input id="c_clientLogoFile" type="file" accept="image/*" /><div class="file-hint">Se escolher uma imagem aqui, ela substitui a URL.</div></div></div></div><div class="modal-foot"><button class="ghost-btn" onclick="closeModal('settingsModal')">Cancelar</button><button class="primary-btn" onclick="saveSettingsModal()">Salvar</button></div>`; document.getElementById('settingsModal').classList.add('show')}
async function saveSettingsModal(){
  let consultancyLogo=document.getElementById('c_consultancyLogo').value.trim();
  let clientLogo=document.getElementById('c_clientLogo').value.trim();
  const consultancyFile=document.getElementById('c_consultancyLogoFile').files[0];
  const clientFile=document.getElementById('c_clientLogoFile').files[0];
  if(consultancyFile) consultancyLogo=await fileToDataUrl(consultancyFile);
  if(clientFile) clientLogo=await fileToDataUrl(clientFile);
  state.config={consultancyName:document.getElementById('c_consultancyName').value.trim(),clientName:document.getElementById('c_clientName').value.trim(),heroSubtitle:document.getElementById('c_heroSubtitle').value.trim(),operationName:document.getElementById('c_operationName').value.trim(),operationIcon:document.getElementById('c_operationIcon').value.trim()||'🏢',consultancyLogo,clientLogo};
  saveState(); renderAll(); closeModal('settingsModal'); toast('Configurações salvas. Exporte o data.json para publicar.');
}
function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='data.json'; a.click(); URL.revokeObjectURL(a.href); toast('data.json baixado.')}
function importJSON(file){const reader=new FileReader(); reader.onload=()=>{try{state=enrich(JSON.parse(reader.result)); saveState(); renderAll(); toast('data.json importado.')}catch(e){alert('Arquivo inválido.')}}; reader.readAsText(file,'utf-8')}
async function loadPublishedVersion(showToast=false){state=clone(await loadPublishedData()); saveState(); renderAll(); if(showToast) toast('Versão publicada carregada.')}
document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>switchPage(btn.dataset.page)));
document.getElementById('importInput').addEventListener('change',e=>{const f=e.target.files[0]; if(f) importJSON(f); e.target.value=''});
window.addEventListener('click',e=>{['detailModal','itemModal','settingsModal','timelineModal'].forEach(id=>{const el=document.getElementById(id); if(e.target===el) el.classList.remove('show')})});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){['detailModal','itemModal','settingsModal','timelineModal'].forEach(id=>closeModal(id))}});
(async function init(){publishedData=await loadPublishedData(); state=loadLocalState(); renderAll();})();
</script>
</body>
</html>
